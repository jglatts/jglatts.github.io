<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Windows Serial Keyboard Wedge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --terminal: #010409;
            --border: #30363d;
            --text: #c9d1d9;
            --muted: #8b949e;
            --bright: #f0f6fc;
            --green: #3fb950;
            --blue: #58a6ff;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: Consolas, Monaco, "Courier New", monospace;
            line-height: 1.65;
        }

        .container {
            max-width: 900px;
        }

        a {
            color: var(--blue);
            text-decoration: none;
        }

            a:hover {
                color: #79c0ff;
                text-decoration: underline;
            }

        h1, h2, h3, h5, .fw-bold {
            color: var(--bright);
        }

        h2 {
            margin-top: 48px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

            h2::before {
                content: "> ";
                color: var(--green);
            }

        .text-muted {
            color: var(--muted) !important;
        }

        .terminal-box {
            background: var(--terminal);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 34px;
        }

        .terminal-header {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--border);
        }

        .prompt {
            color: var(--muted);
            margin-bottom: 10px;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }

            .prompt::before {
                content: "PS C:\\> ";
                color: var(--green);
            }

        .article-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
        }

        .callout {
            background: var(--terminal);
            border: 1px solid var(--border);
            border-left: 4px solid var(--green);
            padding: 18px;
            border-radius: 8px;
            margin: 28px 0;
        }

        code {
            color: var(--bright);
            background: rgba(110,118,129,0.22);
            padding: 2px 5px;
            border-radius: 4px;
        }

        pre {
            background: var(--terminal);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 20px 0;
        }

            pre code {
                background: none;
            }

        footer {
            border-top: 1px solid var(--border);
            padding: 24px 0;
            margin-top: 40px;
            color: var(--muted);
        }

        .back-link {
            color: var(--muted);
        }

            .back-link:hover {
                color: var(--bright);
            }
    </style>
</head>

<body>

    <div class="container py-5">

        <!-- HEADER -->
        <div class="terminal-box">
            <p class="prompt">cd C:\Users\John\Blog\posts</p>
            <p class="prompt">notepad .\windows-serial-keyboard-wedge.html</p>

            <a href="/all-blogs.html" class="back-link">&larr; back</a>

            <h1 class="fw-bold mt-3">
                Writing a Serial Keyboard Wedge for Windows
            </h1>

            <p class="text-muted mb-0">By John Glatts</p>
        </div>

        <!-- ARTICLE -->
        <article class="article-card">

            <p>
            </p>

            <p class="prompt">exit</p>

        </article>

        <footer class="text-center">
            © 2026 John Glatts
        </footer>

    </div>

</body>
</html>
